{{ define "notes_table" }}
<form id="data-table-form" class="wa-stack wa-gap-m">
    <input type="hidden" name="kind" value="notes">
    <input type="hidden" name="filter" value="{{ .Filter }}">
    <wa-scroller>
        <table>
            <thead>
                <tr>
                    <th><input type="checkbox" onchange="document.querySelectorAll('.data-check').forEach(cb => cb.checked = this.checked)"></th>
                    <th>#</th>
                    <th>Tipo</th>
                    <th>Conteúdo</th>
                    <th>Data</th>
                    <th>Horário</th>
                    <th>Itens</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {{ if .Notes }}
                    {{ range .Notes }}
                    <tr>
                        <td><input type="checkbox" class="data-check" name="ids" value="{{ .ID }}"></td>
                        <td>{{ .ID }}</td>
                        <td><wa-badge variant="{{ badge .Type }}">{{ label .Type }}</wa-badge></td>
                        <td>{{ .Content }}</td>
                        <td>{{ dateBR .Date }}</td>
                        <td>{{ deref .Time }}</td>
                        <td>{{ len .Items }}</td>
                        <td class="wa-text-end">
                            <wa-button size="s" variant="brand" hx-get="/data/notes/{{ .ID }}" hx-target="#data-panel-body" hx-swap="innerHTML" hx-target-error="#data-panel-body" data-drawer="open dataPanel">Ver</wa-button>
                        </td>
                    </tr>
                    {{ end }}
                {{ else }}
                    <tr><td colspan="8">Nenhuma nota cadastrada com este filtro.</td></tr>
                {{ end }}
            </tbody>
        </table>
    </wa-scroller>
    <wa-button variant="danger" hx-post="/data/delete" hx-target="#data-table" hx-swap="innerHTML" hx-target-error="#data-table" hx-include="#data-table-form" hx-confirm="Apagar as notas selecionadas?" hx-indicator="#delete-notes-spinner" hx-disabled-elt="this">Apagar selecionados</wa-button>
    <wa-spinner id="delete-notes-spinner" class="htmx-indicator" aria-hidden="true"></wa-spinner>
</form>
{{ end }}
