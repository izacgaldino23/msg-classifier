{{ define "prompt_table" }}
<form id="prompt-form" class="wa-stack wa-gap-m">
    <input type="hidden" name="flow" value="{{ .Flow }}">
    <wa-scroller>
        <table>
            <thead>
                <tr>
                    <th><input type="checkbox" onchange="document.querySelectorAll('.prompt-check').forEach(cb => cb.checked = this.checked)"></th>
                    <th>Mensagem</th>
                    <th>Resultado esperado</th>
                </tr>
            </thead>
            <tbody>
                {{ if .Prompts }}
                    {{ range .Prompts }}
                    <tr>
                        <td><input type="checkbox" class="prompt-check" name="ids" value="{{ .ID }}"></td>
                        <td>{{ .Message }}</td>
                        <td>{{ .ExpectedResult }}</td>
                    </tr>
                    {{ end }}
                {{ else }}
                    <tr><td colspan="3">Nenhum exemplo cadastrado para este fluxo.</td></tr>
                {{ end }}
            </tbody>
        </table>
    </wa-scroller>
    <wa-checkbox id="export" name="export" value="1">Exportar CSV após avaliar</wa-checkbox>
    <wa-button variant="brand" hx-post="/prompts/evaluate" hx-target="#evaluation" hx-swap="innerHTML" hx-target-error="#evaluation" hx-include="#prompt-form" hx-indicator="#evaluate-spinner" hx-disabled-elt="this">
        Avaliar
    </wa-button>
    <wa-spinner id="evaluate-spinner" class="htmx-indicator" aria-hidden="true"></wa-spinner>
</form>
{{ end }}
