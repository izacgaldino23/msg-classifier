{{ define "prompt_table" }}
<form id="prompt-form">
    <input type="hidden" name="flow" value="{{ .Flow }}">
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th><input type="checkbox" onchange="document.querySelectorAll('.prompt-check').forEach(cb => cb.checked = this.checked)"></th>
                    <th>Mensagem</th>
                    <th>Resultado esperado</th>
                </tr>
            </thead>
            <tbody>
                {{ if .Prompts }}
                    {{ range .Prompts }}
                    <tr>
                        <td><input type="checkbox" class="prompt-check" name="ids" value="{{ .ID }}"></td>
                        <td>{{ .Message }}</td>
                        <td>{{ .ExpectedResult }}</td>
                    </tr>
                    {{ end }}
                {{ else }}
                    <tr><td colspan="3">Nenhum exemplo cadastrado para este fluxo.</td></tr>
                {{ end }}
            </tbody>
        </table>
    </div>
    <label>
        <input type="checkbox" name="export" value="1">
        Exportar CSV após avaliar
    </label>
    <button type="button" hx-post="/prompts/evaluate" hx-target="#evaluation" hx-swap="innerHTML" hx-target-error="#evaluation" hx-include="#prompt-form" hx-indicator="this" hx-disabled-elt="this">
        <span class="button-label">Avaliar</span>
        <span class="htmx-indicator" aria-hidden="true"><span class="spinner"></span>Avaliando…</span>
    </button>
</form>
{{ end }}
