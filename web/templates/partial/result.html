{{ define "resultado" }}
<div id="resultado" class="card">
    <p><strong>Categoria:</strong> {{ index .Category "choice" }}</p>
    <p><strong>Confiança:</strong> {{ index .Category "confidence" }}%</p>
    <hr />
    <p><strong>Ação:</strong> {{ index .Kind "choice" }}</p>
    <p><strong>Confiança:</strong> {{ index .Kind "confidence" }}%</p>
</div>
{{ end }}
