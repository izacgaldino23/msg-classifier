{{ define "transactions_table" }}
<form id="data-table-form">
    <input type="hidden" name="kind" value="transaction">
    <input type="hidden" name="filter" value="{{ .Filter }}">
    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th><input type="checkbox" onchange="document.querySelectorAll('.data-check').forEach(cb => cb.checked = this.checked)"></th>
                    <th>Data</th>
                    <th>Tipo</th>
                    <th>Valor</th>
                    <th>Estabelecimento</th>
                    <th>Descrição</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {{ if .Transactions }}
                    {{ range .Transactions }}
                    <tr>
                        <td><input type="checkbox" class="data-check" name="ids" value="{{ .ID }}"></td>
                        <td>{{ dateBR .Date }}</td>
                        <td><span class="badge badge-tx-{{ .Type }}">{{ label .Type }}</span></td>
                        <td>{{ money .Amount }}</td>
                        <td>{{ .Party }}</td>
                        <td>{{ .Content }}</td>
                        <td class="text-end">
                            <button type="button" class="btn btn-sm btn-outline-primary" hx-get="/data/transaction/{{ .ID }}" hx-target="#data-panel-body" hx-swap="innerHTML" hx-target-error="#data-panel-body" hx-on::after-request="bootstrap.Offcanvas.getOrCreateInstance('#dataPanel').show()">Ver</button>
                        </td>
                    </tr>
                    {{ end }}
                {{ else }}
                    <tr><td colspan="7">Nenhuma transação registrada com este filtro.</td></tr>
                {{ end }}
            </tbody>
        </table>
    </div>
    <button type="button" class="btn btn-danger mt-3" hx-post="/data/delete" hx-target="#data-table" hx-swap="innerHTML" hx-target-error="#data-table" hx-include="#data-table-form" hx-confirm="Apagar as transações selecionadas?" hx-indicator="this" hx-disabled-elt="this">
        <span class="button-label">Apagar selecionadas</span>
        <span class="htmx-indicator" aria-hidden="true"><span class="spinner-border spinner-border-sm me-2"></span>Apagando…</span>
    </button>
</form>
{{ end }}
