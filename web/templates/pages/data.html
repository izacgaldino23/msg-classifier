{{ define "page:title" }}Dados{{ end }}
{{ define "page:content" }}
<div class="wa-stack wa-gap-l">
    <h1 class="wa-heading-m">Dados</h1>

    <wa-tab-group @wa-tab-show="activateFilterPills('pane-' + $event.detail.name)">
        <wa-tab slot="nav" panel="contacts">Contatos</wa-tab>
        <wa-tab slot="nav" panel="notes">Notas</wa-tab>
        <wa-tab slot="nav" panel="finance">Finanças</wa-tab>

        <wa-tab-panel id="pane-contacts" name="contacts" active>
            <div class="filter-pills wa-cluster wa-gap-xs">
                <wa-button size="s" variant="brand" data-filter-pill data-filter="all" hx-get="/data/table?kind=contact&filter=all" hx-target="#data-table" hx-swap="innerHTML" hx-target-error="#data-table" hx-trigger="load, click" onclick="markFilterPill(this)">Todos</wa-button>
                <wa-button size="s" data-filter-pill data-filter="phone" hx-get="/data/table?kind=contact&filter=phone" hx-target="#data-table" hx-swap="innerHTML" hx-target-error="#data-table" onclick="markFilterPill(this)">Com telefone</wa-button>
                <wa-button size="s" data-filter-pill data-filter="email" hx-get="/data/table?kind=contact&filter=email" hx-target="#data-table" hx-swap="innerHTML" hx-target-error="#data-table" onclick="markFilterPill(this)">Com e-mail</wa-button>
                <wa-button size="s" data-filter-pill data-filter="name" hx-get="/data/table?kind=contact&filter=name" hx-target="#data-table" hx-swap="innerHTML" hx-target-error="#data-table" onclick="markFilterPill(this)">Só nome</wa-button>
            </div>
            <form id="contactSearchForm" class="wa-cluster wa-gap-xs" hx-get="/data/table" hx-target="#data-table" hx-swap="innerHTML" hx-target-error="#data-table" hx-trigger="input changed delay:400ms from:#contactSearch, search, submit">
                <input type="hidden" name="kind" value="contact">
                <input type="hidden" name="filter" value="all" class="search-filter">
                <input type="search" id="contactSearch" name="search" placeholder="Buscar por nome, telefone ou e-mail...">
                <wa-button type="submit" variant="brand">Buscar</wa-button>
            </form>
        </wa-tab-panel>

        <wa-tab-panel id="pane-notes" name="notes">
            <div class="filter-pills wa-cluster wa-gap-xs">
                <wa-button size="s" variant="brand" data-filter-pill data-filter="all" hx-get="/data/table?kind=notes&filter=all" hx-target="#data-table" hx-swap="innerHTML" hx-target-error="#data-table" onclick="markFilterPill(this)">Todas</wa-button>
                <wa-button size="s" data-filter-pill data-filter="note" hx-get="/data/table?kind=notes&filter=note" hx-target="#data-table" hx-swap="innerHTML" hx-target-error="#data-table" onclick="markFilterPill(this)">Notas</wa-button>
                <wa-button size="s" data-filter-pill data-filter="reminder" hx-get="/data/table?kind=notes&filter=reminder" hx-target="#data-table" hx-swap="innerHTML" hx-target-error="#data-table" onclick="markFilterPill(this)">Lembretes</wa-button>
                <wa-button size="s" data-filter-pill data-filter="todo" hx-get="/data/table?kind=notes&filter=todo" hx-target="#data-table" hx-swap="innerHTML" hx-target-error="#data-table" onclick="markFilterPill(this)">Listas</wa-button>
            </div>
            <form id="noteSearchForm" class="wa-cluster wa-gap-xs" hx-get="/data/table" hx-target="#data-table" hx-swap="innerHTML" hx-target-error="#data-table" hx-trigger="input changed delay:400ms from:#noteSearch, search, submit">
                <input type="hidden" name="kind" value="notes">
                <input type="hidden" name="filter" value="all" class="search-filter">
                <input type="search" id="noteSearch" name="search" placeholder="Buscar no conteúdo...">
                <wa-button type="submit" variant="brand">Buscar</wa-button>
            </form>
        </wa-tab-panel>

        <wa-tab-panel id="pane-finance" name="finance">
            <div class="filter-pills wa-cluster wa-gap-xs">
                <wa-button size="s" variant="brand" data-filter-pill data-filter="all" hx-get="/data/table?kind=transaction&filter=all" hx-target="#data-table" hx-swap="innerHTML" hx-target-error="#data-table" onclick="markFilterPill(this)">Todas</wa-button>
                <wa-button size="s" data-filter-pill data-filter="compra" hx-get="/data/table?kind=transaction&filter=compra" hx-target="#data-table" hx-swap="innerHTML" hx-target-error="#data-table" onclick="markFilterPill(this)">Compras</wa-button>
                <wa-button size="s" data-filter-pill data-filter="venda" hx-get="/data/table?kind=transaction&filter=venda" hx-target="#data-table" hx-swap="innerHTML" hx-target-error="#data-table" onclick="markFilterPill(this)">Vendas</wa-button>
                <wa-button size="s" data-filter-pill data-filter="pagamento" hx-get="/data/table?kind=transaction&filter=pagamento" hx-target="#data-table" hx-swap="innerHTML" hx-target-error="#data-table" onclick="markFilterPill(this)">Pagamentos</wa-button>
                <wa-button size="s" data-filter-pill data-filter="recebimento" hx-get="/data/table?kind=transaction&filter=recebimento" hx-target="#data-table" hx-swap="innerHTML" hx-target-error="#data-table" onclick="markFilterPill(this)">Recebimentos</wa-button>
            </div>
            <form id="txSearchForm" class="wa-cluster wa-gap-xs" hx-get="/data/table" hx-target="#data-table" hx-swap="innerHTML" hx-target-error="#data-table" hx-trigger="input changed delay:400ms from:#txSearch, search, submit">
                <input type="hidden" name="kind" value="transaction">
                <input type="hidden" name="filter" value="all" id="txSearchFilter" class="search-filter">
                <input type="search" id="txSearch" name="search" placeholder="Buscar por estabelecimento, pessoa ou valor...">
                <wa-button type="submit" variant="brand">Buscar</wa-button>
            </form>
        </wa-tab-panel>
    </wa-tab-group>

    <div id="data-table" hx-get="/data/table" hx-trigger="dataChanged from:body" hx-target="#data-table" hx-swap="innerHTML" hx-include="#data-table-form" hx-target-error="#data-table"></div>

    <wa-drawer id="dataPanel" label="Detalhe" placement="end">
        <div slot="header-actions">
            <wa-button size="s" appearance="plain" data-drawer="hide" aria-label="Fechar">
                <wa-icon name="xmark" label="Fechar"></wa-icon>
            </wa-button>
        </div>
        <div id="data-panel-body"></div>
    </wa-drawer>

    <script>
        // The pills own their own active state: the server re-renders
        // #data-table but never the pill list, so a server-driven highlight
        // would be lost on every delete re-render.
        function markFilterPill(pill) {
            pill.closest('.filter-pills').querySelectorAll('wa-button')
                .forEach(p => p.setAttribute('variant', p === pill ? 'brand' : 'neutral'));
            // Every search box carries its own filter, so a pill click
            // re-points the one on its pane: otherwise a search would filter a
            // different type than the one on screen.
            const hidden = pill.closest('wa-tab-panel')?.querySelector('.search-filter');
            if (pill.dataset.filter && hidden) {
                hidden.value = pill.dataset.filter;
            }
        }

        // Switching the outer tab must not leave the other kind's table on
        // screen, so select (and load) that pane's default filter. It runs
        // unconditionally: wa-tab-panel ships "active" on the contacts pane
        // and moves it itself, so an `active` guard would skip the load exactly
        // when you re-select the tab already showing.
        function activateFilterPills(paneId) {
            document.getElementById(paneId)
                ?.querySelector('.filter-pills wa-button')?.click();
        }
    </script>
</div>
{{ end }}
