{{ define "page:title" }}Home{{ end }}
{{ define "page:content" }}
<div class="wa-stack wa-gap-l">
    <section class="wa-stack wa-gap-xs">
        <h1 class="wa-heading-m">Classificador de Mensagens</h1>
        <p class="wa-color-text-quiet">Envie uma mensagem e veja a categoria, a ação e os contatos extraídos.</p>
    </section>

    <form hx-post="/api/message" hx-target="#resultado" hx-swap="innerHTML" class="wa-stack wa-gap-m">
        <wa-input name="message" label="Mensagem:" type="text" required></wa-input>

        <!-- User id is still mocked; hidden until a real session supplies it. -->
        <input type="hidden" name="user_id" value="12345">

        <wa-button type="submit" variant="brand" hx-indicator="#msg-spinner" hx-disabled-elt="this">
            Enviar
        </wa-button>
        <wa-spinner id="msg-spinner" class="htmx-indicator" aria-hidden="true"></wa-spinner>
    </form>

    <div id="resultado"></div>
</div>
{{ end }}
