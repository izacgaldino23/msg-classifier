{{ define "page:title" }}Validação Jev{{ end }}
{{ define "page:active" }}prompts{{ end }}
{{ define "page:content" }}
<div class="wa-stack wa-gap-l">
    <h1 class="wa-heading-m">Validação Jev</h1>

    <wa-select id="flow" name="flow" label="Fluxo:" hx-get="/prompts/table" hx-target="#prompt-table" hx-swap="innerHTML" hx-target-error="#prompt-table" hx-trigger="load, change">
        <wa-option value="classification">Classificação</wa-option>
        <wa-option value="name">Extração de nome</wa-option>
        <wa-option value="note">Tipo de nota</wa-option>
        <wa-option value="finance">Tipo de transação</wa-option>
    </wa-select>

    <form hx-post="/prompts" hx-target="#prompt-table" hx-swap="innerHTML" hx-target-error="#prompt-table" hx-include="#flow" class="wa-stack wa-gap-m">
        <wa-textarea name="message" label="Mensagem:" required></wa-textarea>
        <wa-input name="expected" label="Resultado esperado:" type="text" required></wa-input>
        <wa-button type="submit" variant="brand" hx-indicator="#add-spinner" hx-disabled-elt="this">
            Adicionar exemplo
        </wa-button>
        <wa-spinner id="add-spinner" class="htmx-indicator" aria-hidden="true"></wa-spinner>
    </form>

    <div id="prompt-table"></div>
    <div id="evaluation"></div>
</div>
{{ end }}
