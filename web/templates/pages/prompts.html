{{ define "page:title" }}Validação Jev{{ end }}
{{ define "page:active" }}prompts{{ end }}
{{ define "page:content" }}
<div>
    <h1 class="mb-4">Validação Jev</h1>

    <div class="mb-3">
        <label for="flow" class="form-label">Fluxo:</label>
        <select id="flow" name="flow" class="form-select" hx-get="/prompts/table" hx-target="#prompt-table" hx-swap="innerHTML" hx-target-error="#prompt-table" hx-trigger="load, change">
            <option value="classification">Classificação</option>
            <option value="name">Extração de nome</option>
            <option value="note">Tipo de nota</option>
        </select>
    </div>

    <form hx-post="/prompts" hx-target="#prompt-table" hx-swap="innerHTML" hx-target-error="#prompt-table" hx-include="#flow">
        <div class="mb-3">
            <label for="message" class="form-label">Mensagem:</label>
            <textarea id="message" name="message" class="form-control" required></textarea>
        </div>
        <div class="mb-3">
            <label for="expected" class="form-label">Resultado esperado:</label>
            <input type="text" id="expected" name="expected" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary" hx-indicator="this" hx-disabled-elt="this">
            <span class="button-label">Adicionar exemplo</span>
            <span class="htmx-indicator" aria-hidden="true"><span class="spinner-border spinner-border-sm me-2"></span>Adicionando…</span>
        </button>
    </form>

    <div id="prompt-table" class="mt-4"></div>
    <div id="evaluation" class="mt-4"></div>
</div>
{{ end }}
