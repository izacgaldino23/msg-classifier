{{ define "page:active" }}home{{ end }}
{{ define "base" }}
<!doctype html>
<html lang="pt-BR">
	<head>
		<title>MSG Classifier - {{ template "page:title" . }}</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M16 7.5c-4.7 0-8.5 3.4-8.5 7.5 0 2.4 1.2 4.5 3.1 5.9L9.5 25l4.6-2.3c.6.1 1.3.2 1.9.2 4.7 0 8.5-3.4 8.5-7.5S20.7 7.5 16 7.5z' fill='white'/%3E%3C/svg%3E">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<link rel="stylesheet" href="/static/css/app.css">
	</head>

	<body class="page-{{ template "page:active" . }}" hx-ext="response-targets" hx-target-error="#resultado">
		<!-- Mobile topbar with hamburger (hidden at lg+) -->
		<nav class="navbar d-lg-none border-bottom">
			<div class="container-fluid">
				<a class="navbar-brand brand" href="/"><span class="brand-mark"></span>MSG Classifier</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas" aria-controls="sidebarOffcanvas" aria-label="Abrir menu"><span class="navbar-toggler-icon"></span></button>
			</div>
		</nav>

		<!-- Flex wrapper: sidebar column + main side by side at lg+ -->
		<div class="app-layout d-flex">
			<!-- Sidebar: offcanvas drawer < lg, static column >= lg -->
			<div class="offcanvas-lg offcanvas-start sidebar" tabindex="-1" id="sidebarOffcanvas" aria-labelledby="sidebarOffcanvasLabel">
				<div class="offcanvas-header d-lg-none">
					<h5 class="offcanvas-title" id="sidebarOffcanvasLabel">Menu</h5>
					<button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarOffcanvas" aria-label="Fechar"></button>
				</div>
				<div class="offcanvas-body d-flex flex-column p-3">
					<a class="brand mb-4" href="/"><span class="brand-mark"></span>MSG Classifier</a>
					<nav class="sidebar-nav nav flex-column">
						<a class="nav-link" href="/"><i class="bi bi-house-door me-2"></i>Classificador</a>
						<a class="nav-link" href="/prompts"><i class="bi bi-clipboard-check me-2"></i>Validação Jev</a>
					</nav>
				</div>
			</div>

			<!-- Main content -->
			<main class="flex-grow-1">
				<div class="content-wrapper">
					{{ template "page:content" . }}
				</div>
			</main>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/htmx-ext-response-targets@2.0.4" integrity="sha384-T41oglUPvXLGBVyRdZsVRxNWnOOqCynaPubjUVjxhsjFTKrFJGEMm3/0KGmNQ+Pg" crossorigin="anonymous"></script>
	</body>
</html>
{{ end }}
