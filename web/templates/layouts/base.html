{{ define "page:active" }}home{{ end }}
{{ define "base" }}
<!doctype html>
<html lang="pt-BR">
	<head>
		<title>MSG Classifier - {{ template "page:title" . }}</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M16 7.5c-4.7 0-8.5 3.4-8.5 7.5 0 2.4 1.2 4.5 3.1 5.9L9.5 25l4.6-2.3c.6.1 1.3.2 1.9.2 4.7 0 8.5-3.4 8.5-7.5S20.7 7.5 16 7.5z' fill='white'/%3E%3C/svg%3E">
		<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css" />
		<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>

		<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/native.css" />
		<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/utilities.css" />
		<link rel="stylesheet" href="/static/css/app.css">
	</head>

	<body hx-ext="response-targets" hx-target-error="#resultado">
		<wa-page mobile-breakpoint="992px">
			<div slot="navigation" class="wa-stack wa-gap-l">
				<a class="brand" href="/"><span class="brand-mark"></span>MSG Classifier</a>
				<nav class="sidebar-nav wa-stack wa-gap-xs">
					<a href="/" {{ if eq .Page "home" }}class="active"{{ end }}>Classificador</a>
					<a href="/prompts" {{ if eq .Page "prompts" }}class="active"{{ end }}>Validação Jev</a>
					<a href="/data" {{ if eq .Page "data" }}class="active"{{ end }}>Dados</a>
				</nav>
			</div>

			<div class="content-wrapper">
				{{ template "page:content" . }}
			</div>
		</wa-page>

		<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/htmx-ext-response-targets@2.0.4" integrity="sha384-T41oglUPvXLGBVyRdZsVRxNWnOOqCynaPubjUVjxhsjFTKrFJGEMm3/0KGmNQ+Pg" crossorigin="anonymous"></script>
	</body>
</html>
{{ end }}
